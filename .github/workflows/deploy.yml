name: Deploy site

on:
  push:
    branches:
      - main
  # workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1️⃣ Checkout
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      # 2️⃣ Setup Ruby (Jekyll)
      - name: Setup Ruby 💎
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true

      # 3️⃣ Setup Node (Pagefind)
      - name: Setup Node 🟢
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # 4️⃣ Setup Python (若有 notebook 或 nbconvert)
      - name: Setup Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      # 5️⃣ Install OS dependencies (only if really needed)
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          pip3 install --upgrade nbconvert

      # 6️⃣ Build Jekyll (Production mode)
      - name: Build Jekyll 🔧
        env:
          JEKYLL_ENV: production
        run: |
          bundle exec jekyll build

      # 7️⃣ Run Pagefind indexing (optimized)
      - name: Run Pagefind Indexing 🔍
        run: |
          npx pagefind \
            --site "_site" \
            --output-subdir "pagefind" \
            --exclude-selectors "nav,footer,.post-meta,.related-posts" \
            --verbose

      # 8️⃣ Upload artifact for GitHub Pages
      - name: Upload artifact 📦
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages 🚀
        id: deployment
        uses: actions/deploy-pages@v4
